<section class="page" id="contact">
    <div class="container">
        <div class="page-content">
            <h2 class="section-title">Get In Touch</h2>
            <div class="contact-grid">
                <div class="contact-info">
                    <div class="contact-item" *ngFor="let info of contactInfo">
                        <div class="contact-icon">{{ info.icon }}</div>
                        <div>
                            <h4>{{ info.title }}</h4>
                            <p>
                                <a *ngIf="info.link; else noLink" [href]="info.link" 
                                   [class]="info.title === 'Email' || info.title === 'Phone' ? '' : 'external-link'">
                                    {{ info.value }}
                                </a>
                                <ng-template #noLink>{{ info.value }}</ng-template>
                            </p>
                        </div>
                    </div>
                </div>

                <form class="contact-form" [formGroup]="contactForm" (ngSubmit)="onSubmit()">
                    <h3 style="margin-bottom: 2rem; color: #333;">Send a Message</h3>
                    
                    <!-- Success/Error Message -->
                    <div *ngIf="submitMessage" 
                         [class]="submitMessage.includes('error') || submitMessage.includes('Sorry') ? 'alert alert-error' : 'alert alert-success'">
                        {{ submitMessage }}
                    </div>

                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" 
                               id="name" 
                               formControlName="name"
                               [class.error]="hasError('name')"
                               placeholder="Your full name">
                        <div *ngIf="hasError('name')" class="error-message">
                            {{ getErrorMessage('name') }}
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" 
                               id="email" 
                               formControlName="email"
                               [class.error]="hasError('email')"
                               placeholder="your.email@example.com">
                        <div *ngIf="hasError('email')" class="error-message">
                            {{ getErrorMessage('email') }}
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject *</label>
                        <input type="text" 
                               id="subject" 
                               formControlName="subject"
                               [class.error]="hasError('subject')"
                               placeholder="Brief subject of your message">
                        <div *ngIf="hasError('subject')" class="error-message">
                            {{ getErrorMessage('subject') }}
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="message">Message *</label>
                        <textarea id="message" 
                                  formControlName="message"
                                  [class.error]="hasError('message')"
                                  placeholder="Your message..."
                                  rows="5"></textarea>
                        <div *ngIf="hasError('message')" class="error-message">
                            {{ getErrorMessage('message') }}
                        </div>
                    </div>

                    <button type="submit" 
                            class="btn btn-primary" 
                            style="width: 100%;"
                            [disabled]="isSubmitting">
                        <span *ngIf="!isSubmitting">Send Message</span>
                        <span *ngIf="isSubmitting">Sending...</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
