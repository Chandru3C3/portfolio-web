<section class="experience-section">
  <div class="container">
    <div class="page-content">
      <h2 class="section-title">Professional Experience</h2>
      <div class="timeline">
        <div 
          class="timeline-item" 
          *ngFor="let experience of experiences; let i = index; trackBy: trackByIndex"
          [attr.data-index]="i"
        >
          <div class="timeline-content">
            <h3>{{ experience.title }}</h3>
            <div class="timeline-date">{{ experience.company }} | {{ experience.period }}</div>
            <p class="description">{{ experience.description }}</p>
            <ul class="achievements" *ngIf="experience.achievements.length > 0">
              <li *ngFor="let achievement of experience.achievements">{{ achievement }}</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
